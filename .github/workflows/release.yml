# Release: publish @vibecontrols/plugin-sdk to npm at a CalVer version.
#
# Rendered from algoshred/dev platform/context/delivery/cicd/templates/release-npm.yml.tmpl
# (G60, adopted in G61). This is the ONLY path to the registry: the version
# comes from a pushed CalVer tag, the dispatch input, or today's next free patch,
# and is never committed back.
#
# This repository is PUBLIC, and a public repository cannot call reusable
# workflows from the private algoshred/dev repository. So the two dev workflows
# are vendored next to this file, byte-for-byte from dev tag v2026.1021.1:
# vendored-release-npm.yml (gates, build, npm publish with the org NPM_TOKEN)
# and vendored-release-finalize.yml (landing check, git tag, GitHub Release).
# To pick up a dev change, re-copy both from one dev tag.
#
# Being public is also what lets npm accept a provenance statement, so this
# release publishes with --provenance.
#
# Trigger: push a CalVer tag (git tag 2026.1021.1 && git push origin 2026.1021.1)
# or run it from the Actions tab (empty version = today's next free patch).
# Guide: ~/products/dev/platform/context/delivery/cicd/HOW_TO_RELEASE_CLIENT_PACKAGES.md

name: Release

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "CalVer version (e.g. 2026.1021.1). Leave empty to auto-compute."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    uses: ./.github/workflows/vendored-release-npm.yml
    permissions:
      contents: read
      id-token: write
    with:
      package-name: "@vibecontrols/plugin-sdk"
      version: ${{ inputs.version || '' }}
      verify-command: "bun run format:check && bun run lint:sanity && bun run type:check && bun run knip && bun run test"
      provenance: true
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  finalize:
    needs: publish
    uses: ./.github/workflows/vendored-release-finalize.yml
    permissions:
      contents: write
    with:
      registry: npm
      package-name: ${{ needs.publish.outputs.package-name }}
      version: ${{ needs.publish.outputs.version }}
      smoke-command: ""
