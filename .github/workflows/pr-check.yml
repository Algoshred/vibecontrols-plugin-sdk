# vendored from algoshred/ci-workflows@b0ab9a9b9fc922aacc7cf441b2f84dcce731749e
# source: templates/node-lib/pr-check.yml. Do not edit: regenerate with scripts/vendor.ts in algoshred/ci-workflows.
# Local edits after vendoring (BOFF-10675): min-dts 21, and the AI review jobs below PR Gate.
# Caller for node-lib-pr-check.yml (platform libraries, CLIs, MCP servers,
# sdk-node, plugins). Copy to .github/workflows/pr-check.yml, then pin it:
#   bun scripts/repin.ts <clone> --sha <ci-workflows sha> --version <tag>
# Public repositories vendor it instead:
#   bun scripts/vendor.ts --dest <clone> --template node-lib/pr-check.yml --ref <tag> --version <tag>
#
# Keep repo-specific jobs (service-container suites, parity checks, ...) as
# jobs in this file and add each one to PR Gate's `needs`. The AI review block
# that apply-ai-review.ts appends (needs: [pr-gate]) stays below PR Gate.
name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: ./.github/workflows/ci-workflows--node-lib-pr-check.yml
    permissions:
      contents: read
      checks: write
    with:
      # Coverage floors come from package.json "boff".coverage; set these only
      # to override them (never lower an existing threshold).
      pack-check: true
      # The published 2026.601.1 tarball holds 21 .d.ts files (one per entry).
      min-dts: 21
    secrets: inherit

  pr-gate:
    # The only required context. Keep this job id and name exactly.
    name: PR Gate
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and (to_entries | all(.value.result == "success"))' <<< "$NEEDS"

  # ai-review-standard: v3
  claude-review:
    name: Claude Code Review
    needs: [pr-gate]
    if: github.event_name == 'pull_request' && needs.pr-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for code quality, bugs, security, performance, and test coverage.
            Use the repository's CLAUDE.md / AGENTS.md for style and conventions when present.
            Do not modify files. Only post GitHub comments.

            Post exactly ONE top-level summary via `gh pr comment`. Begin it with this exact heading (first line):
            **AI Review — Claude Opus 4.6** (`claude-opus-4-6`)

            For each specific issue on a changed line, use `mcp__github_inline_comment__create_inline_comment` with `confirmed: true`.
            Put finding details (tags, explanation) in inline comments; keep the summary brief (counts + highest-severity items).
            Tag findings with [BUG], [SECURITY], [IMPROVEMENT], [BEST PRACTICE] and [LOW], [MEDIUM], or [HIGH].
            If there are no meaningful issues, say "No issues found. Good job!" in the summary only.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr list:*)"
            --model claude-opus-4-6

  opencode-minimax-review:
    name: OpenCode Review (Minimax M2.7)
    needs: [pr-gate]
    if: vars.AI_REVIEW_OPENCODE_ENABLED == 'true' && github.event_name == 'pull_request' && needs.pr-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: OpenCode review (Minimax M2.7)
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        with:
          model: minimax/MiniMax-M2.7
          use_github_token: true
          share: false
          prompt: |
            Your entire response is posted as exactly ONE GitHub PR comment. Do not use tools to post comments.
            Inline diff comments are not available for OpenCode; cite file paths and line numbers in the comment body.

            Begin the comment with this exact heading (first line):
            **AI Review — Minimax M2.7** (`minimax/MiniMax-M2.7`)

            Review this pull request:
            - Check for code quality issues
            - Look for potential bugs and security issues
            - Suggest improvements and best practices
            - Don't modify any files
            - Tag each finding with [BUG], [SECURITY], [IMPROVEMENT], [BEST PRACTICE] and [LOW], [MEDIUM], or [HIGH]
            - If there are no issues, say "No issues found. Good job!"

